name: Probe live widget rotation
on:
  push:
    branches: [main, codex/widget-artwork-sync]
    paths: ['ios/ClockWidgets/ClockMotion.swift', 'lib/ui/clock_dial.dart', 'test/render_previews_test.dart', 'third_party/ClockHandKit/**', 'tool/widget_motion_probe/**', '.github/workflows/widget-motion-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator-runtime:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Export real App layers and reference frames
        run: flutter test --no-pub test/render_previews_test.dart --dart-define=RENDER_PREVIEWS=true --reporter expanded
      - name: Build simulator runtime probe
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          mkdir -p build/checks
          clock_arch=$(uname -m)
          clock_sdk=$(xcrun --sdk iphonesimulator --show-sdk-path)
          xcrun swiftc -parse-as-library -target "$clock_arch-apple-ios18.0-simulator" -sdk "$clock_sdk" third_party/ClockHandKit/ClockHandRotationEffect.swift ios/Shared/ClockWidgetData.swift ios/ClockWidgets/ClockMotion.swift ios/ClockWidgets/MechanicalWidgetFace.swift tool/widget_motion_probe/main.swift -o build/checks/widget-motion-probe
          codesign --force --sign - build/checks/widget-motion-probe
          mkdir -p build/checks/WidgetMotionProbe.app
          cp build/checks/widget-motion-probe build/checks/WidgetMotionProbe.app/WidgetMotionProbe
          cp -R build/previews/widget-artwork build/checks/WidgetMotionProbe.app/
          python3 - <<'PY'
          import plistlib,pathlib
          info={'CFBundleIdentifier':'com.xiongjian.widget.motion-probe','CFBundleExecutable':'WidgetMotionProbe','CFBundleName':'WidgetMotionProbe','CFBundlePackageType':'APPL','CFBundleVersion':'1','CFBundleShortVersionString':'1.0','MinimumOSVersion':'18.0','LSRequiresIPhoneOS':True,'UIDeviceFamily':[1,2],'UILaunchScreen':{}}
          pathlib.Path('build/checks/WidgetMotionProbe.app/Info.plist').write_bytes(plistlib.dumps(info))
          PY
          codesign --force --sign - build/checks/WidgetMotionProbe.app
      - name: Decode effect in actual simulator runtime
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > build/checks/devices.json
          clock_device=$(python3 - <<'PY'
          import json
          data=json.load(open('build/checks/devices.json'))['devices']
          candidates=[(runtime,device) for runtime,devices in data.items() if 'iOS-' in runtime for device in devices if device.get('isAvailable') and 'iPhone' in device.get('name','')]
          candidates.sort(key=lambda item:tuple(int(x) for x in item[0].split('iOS-')[-1].split('-')),reverse=True)
          if not candidates: raise SystemExit('No iPhone simulator runtime installed')
          print(candidates[0][1]['udid'])
          PY
          )
          xcrun simctl boot "$clock_device" || true
          xcrun simctl bootstatus "$clock_device" -b
          xcrun simctl spawn "$clock_device" "$PWD/build/checks/widget-motion-probe" 2>&1 | tee build/checks/runtime-probe.log
          xcrun simctl install "$clock_device" "$PWD/build/checks/WidgetMotionProbe.app"
          xcrun simctl launch --console --terminate-running-process "$clock_device" com.xiongjian.widget.motion-probe --render-app 2>&1 | tee build/checks/artwork-render.log
          clock_container=$(xcrun simctl get_app_container "$clock_device" com.xiongjian.widget.motion-probe data)
          cp "$clock_container"/Documents/*.png build/checks/
          grep -q ARTWORK_RENDER_PASS build/checks/artwork-render.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widget-rotation-runtime-probe
          path: build/checks/
          if-no-files-found: ignore
